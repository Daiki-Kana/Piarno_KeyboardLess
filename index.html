<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>Piarno</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <!-- 縦画面時の横向き案内 -->
    <div id="portrait-warning" class="portrait-warning">
      <span>画面を横向きにしてください</span>
    </div>

    <div class="camera-container">
      <video id="webcam" autoplay playsinline webkit-playsinline muted></video>
      <canvas id="output-canvas"></canvas>

      <!-- 横画面セーフエリア対応 白黒ミニマルデバッグHUD -->
      <div id="debug-hud" class="debug-hud">
        <div class="hud-row"><span class="hud-label">PERM   :</span> <span id="hud-perm">pending</span></div>
        <div class="hud-row"><span class="hud-label">CALIB  :</span> <span id="hud-calib">Fallback</span></div>
        <div class="hud-row"><span class="hud-label">PITCH  :</span> <span id="hud-pitch">--</span></div>
        <div class="hud-row"><span class="hud-label">STATE  :</span> <span id="hud-state">AIRBORNE</span></div>
        <div class="hud-row"><span class="hud-label">TIP Y  :</span> <span id="hud-tip-y">--</span></div>
        <div class="hud-row hud-rope-row">
          <div><span class="hud-label">ROPE Y :</span> <span id="hud-rope-y">0.750</span></div>
          <div class="hud-buttons">
            <button id="hud-btn-up" class="hud-ctrl-btn" title="ロープを上げる">▲</button>
            <button id="hud-btn-down" class="hud-ctrl-btn" title="ロープを下げる">▼</button>
          </div>
        </div>
        <div class="hud-row"><span class="hud-label">DIFF   :</span> <span id="hud-diff">--</span></div>
        <div class="hud-row hud-target-row"><span class="hud-label">TARGET :</span> <span id="hud-target">--</span></div>
      </div>

      <!-- 起動・カウントダウン用ミニマルオーバーレイ -->
      <div id="start-overlay" class="overlay">
        <button id="camera-btn" class="minimal-btn" disabled>初期化中...</button>
        <button id="countdown-btn" class="minimal-btn" style="display: none;">スタート</button>
        <div id="countdown-display" class="countdown-text"></div>
      </div>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
